# Stage 2 SFT for HyLo-Llama-4MLA12GDN-8K-SFT: 4 MLA + 12 Gated DeltaNet layers,
# 8k context, combined data mixture, Llama-3.1-8B-Instruct teacher.
# Use with: accelerate launch --config_file configs/fsdp_GDN.yaml train_hybrid/train_distill.py configs/llama3.2_1B/zebra_4MLA12GDN_8bT_SFT_8k_combined.yaml

# Model arguments
model_name_or_path: meta-llama/Llama-3.2-1B-Instruct
teacher_model_name_or_path: meta-llama/Llama-3.1-8B-Instruct
linear_type: gdn
linear_ILD_path: checkpoints/Zebra-1B-ILD-GDN
mla_ILD_path: checkpoints/Zebra-1B-ILD-MLA
with_distill: false
mla_layers: [1, 5, 10, 14]
init_with_svd: false
init_with_kqvo: false
decontaminate: true
torch_dtype: bfloat16
use_flash_attention_2: true
fused_linear_cross_entropy: false   # Liger kernel; set true only if not hitting Triton/liger mem faults on multinode
fused_linear_cross_entropy_compile: true  # torch.compile(lm_head + CE); use instead of Liger for multinode

# Data training arguments
data_ratio: 1.0
chat_template: "{% set loop_messages = messages %}{% for message in loop_messages %}{% set content = '<|start_header_id|>' + message['role'] + '<|end_header_id|>\n\n'+ message['content'] | trim + '<|eot_id|>' %}{% if loop.index0 == 0 %}{% set content = bos_token + content %}{% endif %}{{ content }}{% endfor %}{% if add_generation_prompt %}{{ '<|start_header_id|>assistant<|end_header_id|>\n\n' }}{% endif %}"
dataset_mixer:
  JunxiongWang/sftdatasetv3: 1.0
  # The published mixture also drew on four AMD-preprocessed datasets that are not part
  # of this release. Each is a reformatted (chat-templated, length-filtered) variant of a
  # public upstream; add the upstreams below to reproduce the mixture:
  #   nvidia/OpenMathInstruct-2       (cc-by-4.0)    2M-sample subset
  #   open-thoughts/OpenThoughts-114k (apache-2.0)   math split
  #   open-r1/OpenR1-Math-220k        (apache-2.0)   full set
  #   nvidia/ChatQA2-Long-SFT-data    (cc-by-nc-2.0) long_sft_QA split; supplies the
  #                                                  long-context supervision
  # See "Training data" in README.md for the conversion the AMD variants applied.
dataset_splits:
- train
- test
preprocessing_num_workers: 128

# SFT trainer config
bf16: true
do_eval: true
ILD: false
eval_strategy: epoch
factor: 4.0
gradient_accumulation_steps: 1
gradient_checkpointing: false
gradient_checkpointing_kwargs:
  use_reentrant: False
learning_rate: 6.0e-05
log_level: info
logging_steps: 10
logging_strategy: steps
lr_scheduler_type: cosine
max_seq_length: 8192
max_steps: -1
num_train_epochs: 1
original_max_position_embeddings: 2048
output_dir: checkpoints/zebra_4MLA12GDN_8bT_SFT_8k_combined
overwrite_output_dir: true
per_device_eval_batch_size: 2
per_device_train_batch_size: 4
push_to_hub: false
remove_unused_columns: true
report_to:
- wandb
save_strategy: "steps"
save_steps: 1000
save_total_limit: 1
seed: 42
warmup_ratio: 0.01
kl_weight: 1.0
ce_weight: 0.0
fused_kl: true


# MLA configs
q_lora_rank: 1344
qk_rope_head_dim: 32
kv_lora_rank: 128
v_head_dim: 64
qk_nope_head_dim: 32
use_lora_layer_norm: false
use_full_kv_head: false
